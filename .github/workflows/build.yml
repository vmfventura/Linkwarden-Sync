name: Build extension packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read and validate package version
        id: metadata
        run: |
          version="$(python3 scripts/verify-packages.py --print-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  packages:
    name: Package (${{ matrix.browser }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            script: zip
          - browser: firefox
            script: zip:firefox
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Build browser package
        env:
          PACKAGE_SCRIPT: ${{ matrix.script }}
        run: npm run "$PACKAGE_SCRIPT"

      - name: Verify archives and generate SHA-256 checksums
        env:
          TARGET_BROWSER: ${{ matrix.browser }}
        run: python3 scripts/verify-packages.py "$TARGET_BROWSER"

      - name: Upload browser package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkwarden-sync-${{ matrix.browser }}-${{ needs.checks.outputs.version }}
          path: |
            .output/linkwarden-sync-${{ needs.checks.outputs.version }}-${{ matrix.browser }}.zip
            .output/linkwarden-sync-${{ needs.checks.outputs.version }}-${{ matrix.browser }}-SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload Firefox review sources
        if: matrix.browser == 'firefox'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkwarden-sync-sources-${{ needs.checks.outputs.version }}
          path: |
            .output/linkwarden-sync-${{ needs.checks.outputs.version }}-sources.zip
            .output/linkwarden-sync-${{ needs.checks.outputs.version }}-sources-SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
