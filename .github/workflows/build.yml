name: Build extension packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read and validate package version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$(python3 scripts/verify-packages.py --print-version --tag "$RELEASE_TAG")"
          else
            version="$(python3 scripts/verify-packages.py --print-version)"
          fi
          commit="$(git rev-parse HEAD)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Test release safeguards
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'

  packages:
    name: Package (${{ matrix.browser }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            script: zip
          - browser: firefox
            script: zip:firefox
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Build browser package
        env:
          PACKAGE_SCRIPT: ${{ matrix.script }}
        run: npm run "$PACKAGE_SCRIPT"

      - name: Verify archives and generate SHA-256 checksums
        env:
          TARGET_BROWSER: ${{ matrix.browser }}
        run: python3 scripts/verify-packages.py "$TARGET_BROWSER"

      - name: Upload browser package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkwarden-sync-${{ matrix.browser }}-${{ needs.checks.outputs.version }}
          path: |
            .output/linkwarden-sync-${{ needs.checks.outputs.version }}-${{ matrix.browser }}.zip
            .output/linkwarden-sync-${{ needs.checks.outputs.version }}-${{ matrix.browser }}-SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload Firefox review sources
        if: matrix.browser == 'firefox'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkwarden-sync-sources-${{ needs.checks.outputs.version }}
          path: |
            .output/linkwarden-sync-${{ needs.checks.outputs.version }}-sources.zip
            .output/linkwarden-sync-${{ needs.checks.outputs.version }}-sources-SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  release:
    name: Publish tag release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.commit }}
          persist-credentials: false

      - name: Download Chromium package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linkwarden-sync-chrome-${{ needs.checks.outputs.version }}
          path: artifacts/release

      - name: Download Firefox package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linkwarden-sync-firefox-${{ needs.checks.outputs.version }}
          path: artifacts/release

      - name: Download review sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linkwarden-sync-sources-${{ needs.checks.outputs.version }}
          path: artifacts/release

      - name: Verify and publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ needs.checks.outputs.commit }}
        run: >-
          python3 -B scripts/publish-release.py
          --tag "$RELEASE_TAG"
          --commit "$BUILD_COMMIT"
          --repository "$GITHUB_REPOSITORY"
          --asset-dir artifacts/release
